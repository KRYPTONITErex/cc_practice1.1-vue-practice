<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <style>
        .box {
            width: 150px;
            height: 50px;
            margin: 10px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: lightgray;
            border: 2px solid gray;
            border-radius: 8px;
            transition: all 0.3s ease;
            cursor: pointer;
        }
    
        .box:hover {
            background-color: lightblue;
            border-color: blue;
            color: white;
        }
    
        .box:active {
            background-color: darkblue;
            border-color: navy;
            color: white;
        }
    
        .box:focus {
            outline: none;
            box-shadow: 0 0 5px 2px rgba(0, 0, 255, 0.5);
        }

        li{
            list-style: none;
        }
        .favCol{
            background-color: rgb(97, 219, 223);
        }


    </style>

</head>
<body>
    <h2>Vue 3_1.1</h2>



    <div id="app">

        <!-- {{ filteredBooks }} -->


        <div v-if="showInfo">

            <div v-for="book in filteredBooks">

                <ul>
                    <li :class="{favCol:book.isFav}" @click="clickFav(book)">
                        <img :src="book.img" alt="" width="350" height="200">

                        <h3>Book title: {{ book.title }}</h3>
                        <h4>author: {{ book.author }}</h4>
                        <h4>age: {{ book.age }}</h4>
                        <hr>

                    </li>
                </ul>

                

            </div>


        </div>

        <button @click="showInfo=!showInfo">
            <!-- <span>{{showInfo? "Hide Info":"Show Info" }}</span> -->
             <span v-if="!showInfo">Show Info</span>
             <span v-else>Hide Info</span>
        </button>


        <br>

        <div class="box" @mouseover="mouseOverHandler($event,'data')">Mouse Over</div>
        <div class="box" @mouseleave="mouseLeaveHandler">Mouse Leave</div>
        <div class="box" @dblclick="dbclickHandler">DOUBLE Click</div>

        <a :href="link">google.com</a>



    </div>




    <script src="app.js"></script>
</body>
</html>
